[package]
name = "lmplus"
version = "2.5.0"
description = "LMPlus - Lords Mobile PC Account Manager"
authors = ["Meow"]
edition = "2021"

[lib]
name = "lmplus_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
pem = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "tlhelp32", "psapi", "memoryapi", "processthreadsapi", "handleapi", "shellapi", "winbase", "minwindef", "libloaderapi", "winreg", "errhandlingapi", "winnls", "timezoneapi", "sysinfoapi"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true